# assignment-2 constraints check (COM-3820 Parallel Programming, HW #2).
# Copy this file to .github/workflows/assignment-2-constraints.yml at the ROOT of your repo,
# on your PP-COM3820 branch. After each push that changes assignment-2/, GitHub checks your
# submission against the handout's constraints: a green check means none were broken; a red X
# lists them (open the run, or the commit's checks). Do not edit this file.
name: assignment-2 constraints

on:
  push:
    branches: [PP-COM3820]
    paths:
      - "assignment-2/**"
      - ".github/workflows/assignment-2-constraints.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  constraints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the assignment-2 constraints
        run: |
          python3 - <<'PY'
          import hashlib, os, re, sys

          FOLDER = "assignment-2"
          BRANCH = "PP-COM3820"
          PROVIDED = [
              ('pom.xml', 'cf1ead2ad722c4d9fc61755e661b35ba76b267584a27f2cbb5d24fa93da611e2', True),
              ('src/main/java/edu/yu/parallel/App.java', 'e30a5a246c67fd8c5ca38b823dd6aeb628e8b2dd223fff104e17e628f1a5d850', True),
              ('src/main/java/edu/yu/parallel/BrokerService.java', '7e78698098a2541b33839d36337ac7e50c3a9ae9a47c8d578ecc6fd8e5196688', True),
              ('src/main/java/edu/yu/parallel/Brokerage.java', 'e7c082c934f727850f03c6bef5efc966fcc1c0a4a8e71bc68edeab99fe39eacc', True),
              ('src/main/java/edu/yu/parallel/BrokerageSnapshot.java', '66907fe79d1cc3973a055643b63f9b59e02c65b36f9ac458dbf79b718bb5dcbf', True),
              ('src/main/java/edu/yu/parallel/Portfolio.java', '098ab29667565319adc2c5abd86b0dc0d2286fe9398bdfa1dcd6aad12bceddf4', True),
              ('src/main/java/edu/yu/parallel/PriceSource.java', 'dd86728d145785c5cf4c9c96c3907ce89d0d371284b8c77bde71f63f0072b646', True),
              ('src/main/java/edu/yu/parallel/Stock.java', '643334761665ea6e658b94a6049822678dd02fcaacc80ac1143eff64ab0c16df', True),
              ('src/main/java/edu/yu/parallel/StockPrices.java', '0204dfd48892cbd2459ea755b8dcaf55e70430cb7926a842ba50673c637dcc3b', True),
              ('src/main/java/edu/yu/parallel/StockReader.java', '1397fce537ed2649022b450ab241f9f31f1711c64044539197eb3f23fa607152', True),
              ('src/main/java/edu/yu/parallel/TradeServer.java', 'adb6b37aa68c6b2fcbe90692aa831ee1cbad4da52326cb62afd3580cc8cef7cf', True),
              ('src/test/java/edu/yu/parallel/Fixtures.java', 'b9c1af9c117821015638beeca56934e9fc1cc14a86ebab7aeda84392b07915ae', False),
              ('src/test/java/edu/yu/parallel/PublicFunctionalTest.java', 'ce340285feb109d1ab31605512a92eda2fb60c9991fdd71c523877ed032445b7', False),
              ('src/test/java/edu/yu/parallel/PublicHttpTest.java', '38a8a44c9c4048b2577e65daea894a138869f18fcf9db8cd39431f315079393f', False),
              ('src/test/java/edu/yu/parallel/TestPrices.java', '42cebc011bccc7931f18595e83880a20bac4cec099a093756739cf6e706fdd40', False),
              ('src/test/java/edu/yu/parallel/TestStock.java', '96a6151f6958c4a5893df68dcafde9338ccf7559c211b559f4b5d3e57ff3c507', False),
          ]
          CONCURRENT = re.compile('\\b(Concurrent(HashMap|SkipListMap|SkipListSet|LinkedQueue|LinkedDeque|Map|NavigableMap)|CopyOnWrite(ArrayList|ArraySet)|(Linked|Array|Priority)Blocking(Queue|Deque)|LinkedBlockingDeque|Blocking(Queue|Deque)|LinkedTransferQueue|SynchronousQueue|DelayQueue|Collections\\s*\\.\\s*synchronized\\w+)\\b')
          PRINT = re.compile('\\bSystem\\s*\\.\\s*(out|err)\\b')

          def strip_comments(src):
              """Blank out comments and string literals, keeping line numbers."""
              def keep_lines(m):
                  return re.sub(r"[^\n]", " ", m.group(0))
              return re.sub(r'/\*.*?\*/|//[^\n]*|"(\\.|[^"\\\n])*"', keep_lines, src, flags=re.S)


          def fingerprint(path):
              return hashlib.sha256(open(path, "rb").read().replace(b"\r\n", b"\n")).hexdigest()

          violations = []
          branch = os.environ.get("GITHUB_REF_NAME", "")
          if branch and branch != BRANCH:
              violations.append(f"pushed to branch {branch}; submissions must be on {BRANCH}")
          if not os.path.isfile(os.path.join(FOLDER, "pom.xml")):
              violations.append(f"no pom.xml in /{FOLDER}")
          provided_paths = set()
          for rel, digest, required in PROVIDED:
              provided_paths.add(rel)
              path = os.path.join(FOLDER, rel)
              if not os.path.exists(path):
                  if required:
                      violations.append(f"provided file missing: {rel}")
              elif fingerprint(path) != digest:
                  violations.append(f"provided file changed: {rel}")
          src = os.path.join(FOLDER, "src/main/java")
          for d, _, files in os.walk(src):
              for name in sorted(files):
                  if not name.endswith(".java"):
                      continue
                  rel = os.path.relpath(os.path.join(d, name), FOLDER).replace(os.sep, "/")
                  if not rel.startswith("src/main/java/edu/yu/parallel/"):
                      violations.append(f"code outside edu.yu.parallel: {rel}")
                  if rel in provided_paths:
                      continue
                  code = strip_comments(open(os.path.join(d, name), encoding="utf-8", errors="replace").read())
                  for n, line in enumerate(code.splitlines(), 1):
                      if PRINT.search(line):
                          violations.append(f"System.out/err: {rel}:{n}")
                      m = CONCURRENT.search(line)
                      if m:
                          violations.append(f"concurrent collection {m.group(0).split('.')[-1].strip()}: {rel}:{n}")

          lines = [f"- {v}" for v in violations] or ["All assignment-2 constraints are met."]
          report = ("## assignment-2 constraints\n\n" + ("A submission with any violation receives a grade of 0.\n\n" if violations else "")
                    + "\n".join(lines) + "\n")
          print(report)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as f:
                  f.write(report)
          sys.exit(1 if violations else 0)
          PY
